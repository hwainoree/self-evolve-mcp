[package]
name = "self-evolve-mcp"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "A small extensible MCP server using the official Rust SDK"
repository = "https://github.com/hwainoree/self-evolve-mcp"

[dependencies]
axum = "0.8"
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tokio-util = "0.7"
url = "2"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
